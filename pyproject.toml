[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Preserve source snapshots with their original formatting.
extend-exclude = ["benchmarks/cuda_workflows/awkward-cccl-studies"]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

# Preserve the exact imports in historical Awkward source snapshots.
[tool.ruff.lint.per-file-ignores]
"benchmarks/cuda_workflows/**/context_errors.py" = ["I001"]
"benchmarks/cuda_workflows/**/_indexed_fill.py" = ["I001"]
