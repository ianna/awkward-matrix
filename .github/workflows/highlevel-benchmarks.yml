name: High-level Awkward benchmarks

on:
  workflow_dispatch:
    inputs:
      releases:
        description: Comma-separated PyPI releases
        type: string
        default: '2.15.0'
      include_main:
        description: Build and benchmark scikit-hep/awkward main HEAD
        type: boolean
        default: true
      baseline:
        description: Baseline release or main (defaults to the oldest selected release)
        type: string
        default: ''
      profile:
        description: Quick subset or full API inventory
        type: choice
        options: [quick, full]
        default: quick

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.69.0
          locked: true
      - name: Measure selected Awkward versions
        shell: bash
        env:
          RELEASES: ${{ inputs.releases }}
          INCLUDE_MAIN: ${{ inputs.include_main }}
          BASELINE: ${{ inputs.baseline }}
          PROFILE: ${{ inputs.profile }}
        run: |
          mkdir -p results/highlevel/ci
          args=(--releases "$RELEASES" --profile "$PROFILE" --output results/highlevel/ci)
          if [[ "$INCLUDE_MAIN" == false ]]; then args+=(--no-include-main); fi
          if [[ -n "$BASELINE" ]]; then args+=(--baseline "$BASELINE"); fi
          pixi run --locked benchmark "${args[@]}" 2>&1 | tee results/highlevel/ci/run.log
      - name: Upload results
        id: results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: highlevel-awkward-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/highlevel/ci/

      - name: Publish benchmark summary
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.results.outputs.artifact-url }}
        run: |
          {
            if [[ -f results/highlevel/ci/measurements.json ]]; then
              pixi run --locked python -m benchmarks.highlevel.summary results/highlevel/ci/measurements.json
            else
              printf '## Awkward benchmark results\n\nNo measurements were saved. See the job log.\n'
            fi
            if [[ -n "$ARTIFACT_URL" ]]; then
              printf '\n[Download the full results artifact](%s)\n' "$ARTIFACT_URL"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
